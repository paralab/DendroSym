[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dendrosym"
version = "0.1.0"
description = "Symbolic generator for Dendro C++ GR/NR solver code."
readme = "README.md"
license = { file = "License" }
requires-python = ">=3.8"
authors = [
    { name = "David Van Komen", email = "david.paralab@proton.me" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "matplotlib>=3.7",
    "networkx>=3.1",
    "sympy>=1.12",
    "dill>=0.3.8",
    "tomlkit>=0.11.8",
    "jinja2>=3.1",
    "tqdm>=4.60",
    "numpy>=1.24",
    "GitPython>=3.1",
]

[project.optional-dependencies]
gw = ["numpy-quaternion", "spherical-functions"]
cachesim = ["pycachesim"]

[project.scripts]
dendro-build = "dendrosym.cli:main"

[tool.setuptools.packages.find]
include = ["dendrosym*"]

[tool.setuptools.package-data]
dendrosym = [
    "templates/**/*",
    "Lebedev/**/*",
    "parameter_files/**/*",
]
